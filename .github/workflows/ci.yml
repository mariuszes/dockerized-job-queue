name: Dockerized Job Queue CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-check:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t jobqueue-app:test .

  api-tests:
    name: Run API integration tests
    runs-on: ubuntu-latest
    needs: build-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Create test env file
        run: cp .env.example .env

      - name: Start Docker Compose
        run: make dev-detached

      - name: Wait for API health
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8080/health; then
              echo "API is healthy through nginx"
              exit 0
            fi

            echo "Waiting for API through nginx..."
            sleep 2
          done

          echo "API did not become healthy"
          make logs-once
          exit 1

      - name: Run tests
        run: pytest

      - name: Show Docker logs on failure
        if: failure()
        run: make logs-once

      - name: Stop Docker Compose stack
        if: always()
        run: make down-volumes

  image-scan:
    name: Scan Docker image
    runs-on: ubuntu-latest
    needs: build-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image for scanning
        run: docker build -t jobqueue-app:scan .

      - name: Scan Docker image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.69.3 image \
            --severity HIGH,CRITICAL \ 
            --exit-code 0 \ 
            jobqueue-app:scan
# Note: Trivy is configured with exit-code 0, because the scan currently reports HIGH vulnerabilities coming from 
# system packages in the base Python image, not from the application code itself.