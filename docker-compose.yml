services:
  postgres:
    image: postgres:16-alpine
    container_name: jobqueue_postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: jobqueue_api
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - public_net
      - private_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: .
    container_name: jobqueue_worker
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "-m", "app.worker.worker"]
    networks:
      - private_net
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: jobqueue_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - public_net
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  public_net:
  private_net: