apiVersion: gateway.networking.k8s.io/v1
kind: Gateway

metadata:
  name: api-gateway
  namespace: job-queue

spec: 
  gatewayClassName: envoy-gateway-class
  
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: api-gateway-proxy-config

  listeners:
    - name: http
      protocol: HTTP
      port: 80
    